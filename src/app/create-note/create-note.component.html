<div style="display:inline-block;">
  <span style="font-size:20px; font-weight:bold;">Create New {{ getCategoryName(category) }}</span>
  &nbsp;
  <button (click)="toggleVisibility()">{{ isVisible ? 'Hide' : 'Create New' }}</button>
</div>

<div *ngIf="isVisible">
  
  <app-editor
    [mode]="'create'"
    [category]="category"
    (save)="onNoteCreated($event)"
    (cancel)="toggleVisibility()">
  </app-editor>
</div>
<br>
